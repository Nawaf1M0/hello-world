name: Deploy task-manager to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "task-manager/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-manager/package-lock.json

      - name: Install dependencies
        working-directory: task-manager
        run: npm ci

      - name: Build
        working-directory: task-manager
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site (build type "workflow") on first run
          # instead of failing when nobody has enabled Pages in Settings yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: task-manager/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
